[project]
name = "kb"
version = "0.1.0"
description = "Personal knowledge-base CLI with swappable markdown-read and vector-RAG backends"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
vector = [
    "chromadb>=0.5",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "black>=24",
]

[project.scripts]
kb = "kb.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
